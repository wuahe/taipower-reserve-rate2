<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b16" />
    <title>台電供電餘裕率</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="header">
        <div class="brand">
          <p class="eyebrow"><span class="pulse" aria-hidden="true"></span>Taipower Reserve</p>
          <h1>台電供電餘裕率</h1>
        </div>
        <div class="header-actions">
          <div class="date-control" id="date-control">
            <button id="date-button" class="date-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="選擇日期">--</button>
            <div id="calendar-popover" class="calendar-popover" hidden>
              <div class="calendar-head">
                <button id="calendar-prev" class="calendar-nav" type="button" aria-label="上一個月">‹</button>
                <strong id="calendar-title">--</strong>
                <button id="calendar-next" class="calendar-nav" type="button" aria-label="下一個月">›</button>
              </div>
              <div class="calendar-weekdays" aria-hidden="true">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
              </div>
              <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="可選日期"></div>
            </div>
          </div>
          <span id="status-pill" class="status-pill">讀取中</span>
          <button id="refresh-now" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <section class="hero" aria-label="最新數值">
        <article class="hero-card" id="hero-card" data-tone="neutral">
          <div class="hero-top">
            <span class="title">最新供電餘裕率</span>
            <span class="light-badge" id="rate-light">--</span>
          </div>
          <div class="hero-value">
            <strong id="current-rate">--</strong>
            <span class="delta" id="rate-delta"></span>
          </div>
          <div class="gauge" aria-hidden="true">
            <div class="gauge-track">
              <span class="zone z-orange"></span><span class="zone z-yellow"></span><span class="zone z-green"></span>
              <i class="gauge-marker" id="rate-gauge-marker"></i>
            </div>
            <div class="gauge-scale"><span>0%</span><span class="t6">6%</span><span class="t10">10%</span><span>40%+</span></div>
          </div>
        </article>

        <div class="metric-list">
          <article class="metric">
            <span class="metric-dot load" aria-hidden="true"></span>
            <span class="title">即時負載</span>
            <strong id="load-mw">--</strong>
          </article>
          <article class="metric">
            <span class="metric-dot supply" aria-hidden="true"></span>
            <span class="title">供電能力</span>
            <strong id="supply-mw">--</strong>
          </article>
          <article class="metric">
            <span class="metric-dot reserve" aria-hidden="true"></span>
            <span class="title">備轉容量</span>
            <strong id="reserve-mw">--</strong>
          </article>
        </div>
      </section>

      <section class="stats" aria-label="當日統計">
        <div class="stat"><span class="label">最高</span><strong id="high-rate">--</strong></div>
        <div class="stat"><span class="label">最低</span><strong id="low-rate">--</strong></div>
        <div class="stat"><span class="label">平均</span><strong id="avg-rate">--</strong></div>
        <div class="stat"><span class="label">筆數</span><strong id="point-count">--</strong></div>
        <div class="stat"><span class="label">最後更新</span><strong id="updated-at">--</strong></div>
      </section>

      <section class="chart-shell" aria-label="整天供電餘裕率曲線">
        <div class="chart-head">
          <h2>全日曲線</h2>
          <div class="legend">
            <span class="legend-item"><i class="swatch rate"></i>供電餘裕率</span>
            <span class="legend-item"><i class="swatch load"></i>即時負載</span>
            <span class="legend-item"><i class="swatch supply"></i>供電能力</span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="reserve-chart"></canvas>
          <div id="chart-tooltip" class="chart-tooltip" hidden></div>
          <div id="empty-state" class="empty-state">等待第一筆成功資料</div>
        </div>
      </section>

      <footer class="footer">
        <span id="fetch-status">讀取中</span>
        <span class="sep" aria-hidden="true">·</span>
        <span>餘裕率 =（供電能力 − 即時負載）÷ 供電能力</span>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://www.taipower.com.tw/2289/2363/2367/2368/10262/normalPost" target="_blank" rel="noopener noreferrer">台電今日電力資訊 ↗</a>
      </footer>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
